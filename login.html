{% extends 'base.html' %}
{% block title %} — Login{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-bg">
    <div class="bg-orb o1"></div>
    <div class="bg-orb o2"></div>
    <div class="bg-orb o3"></div>
    <div class="bg-orb o4"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-tent">🎪</span>
      <h1>Habit Carnival</h1>
      <p>Your daily adventure awaits!</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username…"
               required autocomplete="username" autofocus>
      </div>
      <div class="form-field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password…"
               required autocomplete="current-password">
      </div>
      <div class="form-row">
        <label class="remember-label">
          <input type="checkbox" name="remember"> Keep me logged in
        </label>
      </div>
      <button type="submit" class="btn-auth">🎡 Enter the Carnival!</button>
    </form>

    <p class="auth-switch">
      New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
